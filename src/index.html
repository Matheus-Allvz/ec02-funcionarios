<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gestão de Funcionários</title>
</head>
<body>
<h1>Gestão de Funcionários</h1>

<form id="form">
  <p><label>Nome <input type="text" id="nome" required></label></p>
  <p><label>Idade <input type="number" id="idade" min="14" required></label></p>
  <p><label>Cargo <input type="text" id="cargo" required></label></p>
  <p><label>Salário <input type="number" id="salario" min="0" step="0.01" required></label></p>
  <button type="button" id="salvar">Cadastrar</button>
</form>

<table border="1">
  <thead>
    <tr><th>ID</th><th>Nome</th><th>Idade</th><th>Cargo</th><th>Salário</th><th>Ações</th></tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<h2>Relatórios</h2>
<button type="button" data-relatorio="salarioAlto">Salário maior que R$ 5.000</button>
<button type="button" data-relatorio="mediaSalarial">Média salarial</button>
<button type="button" data-relatorio="cargos">Cargos únicos</button>
<button type="button" data-relatorio="nomes">Nomes em maiúsculo</button>
<pre id="relatorio"></pre>

<script src="funcionario.js"></script>
<script src="app.js"></script>
</body>
</html>
